name: ci

on:
  push:
    branches: [main, 'production/**']
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (stand-in compiler)
        # The real Fin compiler is not distributable through CI, so the wire
        # protocol and the failure modes are tested against the fake compiler in
        # test/fixtures. Tests that need the real toolchain skip themselves.
        run: node --test --test-concurrency=1 dist/test/integration.test.js dist/test/failures.test.js

      - name: Serve check (initialize over stdio)
        run: node test/tools/smoke.js

  lint:
    name: lint and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check is clean
        run: npx tsc -p tsconfig.json --noEmit
      - name: The published file list is complete
        run: npm pack --dry-run
